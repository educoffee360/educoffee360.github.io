<style>
        :root{
            --bg:#FDFBF7;--coffee:#3E2723;--caramel:#C68642;
            --cl:rgba(198,134,66,.10);--text:#2D241E;--muted:#7D6E64;
            --card:#fff;--border:rgba(62,39,35,.07);
            --sh:0 2px 20px rgba(62,39,35,.06);
            --shl:0 12px 40px rgba(62,39,35,.10);
            --ease:cubic-bezier(.16,1,.3,1)
        }
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

        /* ── SIDEBAR ── */
        .sidebar{position:fixed;top:0;left:0;height:100%;width:240px;background:var(--coffee);display:flex;flex-direction:column;z-index:200;transition:transform .4s var(--ease)}
        .sl{padding:26px 24px 18px;font-family:'DM Serif Display',serif;font-size:1.5rem;color:#fff;border-bottom:1px solid rgba(255,255,255,.08);text-decoration:none;display:block;letter-spacing:-.3px}
        .sl span{color:var(--caramel);font-style:italic}
        .snav{flex:1;padding:14px 0;overflow-y:auto}
        .nl{display:flex;align-items:center;gap:12px;padding:12px 24px;color:rgba(255,255,255,.6);text-decoration:none;font-size:.87rem;font-weight:500;border-left:3px solid transparent;transition:all .25s}
        .nl:hover{color:#fff;background:rgba(255,255,255,.06)}
        .nl.active{color:#fff;border-left-color:var(--caramel);background:rgba(198,134,66,.12)}
        .nl svg{width:17px;height:17px;flex-shrink:0}
        .nsec{padding:18px 24px 5px;font-size:.67rem;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:rgba(255,255,255,.3)}
        .sfooter{padding:18px 22px;border-top:1px solid rgba(255,255,255,.08)}
        .uc{display:flex;align-items:center;gap:10px;padding:10px 13px;background:rgba(255,255,255,.07);border-radius:12px;cursor:pointer}
        .uav{width:34px;height:34px;border-radius:10px;background:var(--caramel);display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',serif;font-size:.9rem;color:#fff;flex-shrink:0}
        .un{font-size:.82rem;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .ur{font-size:.67rem;color:rgba(255,255,255,.5)}
        .lob{background:none;border:none;cursor:pointer;color:rgba(255,255,255,.5);padding:4px;border-radius:6px;display:flex;transition:color .2s;margin-left:auto}
        .lob:hover{color:#fff}

        /* ── MOBILE ── */
        .mhdr{display:none;position:sticky;top:0;z-index:150;background:var(--card);border-bottom:1px solid var(--border);padding:13px 18px;align-items:center;justify-content:space-between;box-shadow:var(--sh)}
        .mlogo{font-family:'DM Serif Display',serif;font-size:1.3rem;color:var(--coffee);text-decoration:none}
        .mlogo span{color:var(--caramel);font-style:italic}
        .ham{background:none;border:none;cursor:pointer;padding:6px;border-radius:8px;color:var(--coffee)}
        .ham svg{width:22px;height:22px}
        .mov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:190;backdrop-filter:blur(3px)}
        .mov.open{display:block}
        .sidebar.mopen{transform:translateX(0)!important}

        /* ── MAIN ── */
        .main{margin-left:240px;padding:30px 26px 40px;min-height:100vh}

        /* ── TOPBAR ── */
        .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;flex-wrap:wrap;gap:12px}
        .tl h1{font-family:'DM Serif Display',serif;font-size:1.85rem;color:var(--coffee);line-height:1;margin-bottom:4px}
        .tl p{font-size:.87rem;color:var(--muted)}
        .tactions{display:flex;gap:10px;flex-wrap:wrap}
        .btn-primary{display:flex;align-items:center;gap:7px;padding:10px 18px;border-radius:50px;background:var(--coffee);color:#fff;border:none;font-family:'DM Sans',sans-serif;font-size:.83rem;font-weight:600;transition:all .3s var(--ease);text-decoration:none;cursor:pointer}
        .btn-primary:hover{background:var(--caramel);transform:translateY(-1px);box-shadow:0 4px 15px rgba(198,134,66,.3)}
        .btn-primary svg{width:16px;height:16px}
        .btn-outline{display:flex;align-items:center;gap:7px;padding:10px 18px;border-radius:50px;background:transparent;color:var(--coffee);border:1.5px solid var(--border);font-family:'DM Sans',sans-serif;font-size:.83rem;font-weight:600;transition:all .3s;text-decoration:none;cursor:pointer}
        .btn-outline:hover{border-color:var(--caramel);color:var(--caramel)}
        .btn-outline svg{width:16px;height:16px}

        /* ── CARD ── */
        .card{background:var(--card);border-radius:20px;border:1px solid var(--border);box-shadow:var(--sh);overflow:hidden}
        .ch{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
        .ctitle{font-family:'DM Serif Display',serif;font-size:1.1rem;color:var(--coffee)}
        .csub{font-size:.78rem;color:var(--muted);margin-top:2px}
        .see-all{font-size:.78rem;font-weight:600;color:var(--caramel);text-decoration:none;padding:5px 10px;border-radius:8px;transition:background .2s}
        .see-all:hover{background:var(--cl)}
        .cbody{padding:18px 20px}

        /* ── EMPTY STATE ── */
        .empty{text-align:center;padding:28px 0;color:var(--muted)}
        .empty-icon{font-size:2.2rem;margin-bottom:10px}
        .empty p{font-size:.85rem;line-height:1.7}
        .empty a{color:var(--caramel);font-weight:600;text-decoration:none}

        /* ── ATTENDANCE FILTER BAR
             Filter fields: date, class_id, batch_code
             Suggested API: GET /api/my_students?batch_code=&date=
        ── */
        .filter-card{margin-bottom:24px}
        .filter-grid{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;justify-content:flex-end}
        .f-field{display:flex;flex-direction:column;gap:6px;flex:1 1 160px;min-width:150px}
        .f-field label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
        .f-field input[type="date"],
        .f-field select{
            appearance:none;-webkit-appearance:none;
            font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:500;color:var(--text);
            background:var(--bg);border:1.5px solid var(--border);border-radius:12px;
            padding:10px 14px;outline:none;cursor:pointer;transition:border-color .25s,box-shadow .25s
        }
        .f-field select{
            background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%237D6E64' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat:no-repeat;background-position:right 12px center;padding-right:34px
        }
        .f-field input[type="date"]:focus,
        .f-field select:focus{border-color:var(--caramel);box-shadow:0 0 0 3px rgba(198,134,66,.15)}
        .filter-grid .btn-primary{flex:0 0 auto;height:41px}

        /* ── ATTENDANCE TABLE
             Student row fields: roll, name, student_id, status (present|absent)
             Rendered into #attendanceRows by the API layer
        ── */
        .att-table{width:100%;border-collapse:collapse}
        .att-table thead th{
            text-align:left;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;
            color:var(--muted);padding:12px 20px;background:rgba(62,39,35,.02);border-bottom:1px solid var(--border)
        }
        .att-table thead th.status-col{text-align:right}
        .att-table tbody tr{border-bottom:1px solid var(--border);transition:background .2s}
        .att-table tbody tr:last-child{border-bottom:none}
        .att-table tbody tr:hover{background:rgba(198,134,66,.04)}
        .att-table td{padding:13px 20px;font-size:.87rem;vertical-align:middle}
        .att-table td.status-col{text-align:right}
        .att-roll{font-family:'DM Serif Display',serif;color:var(--coffee);font-size:.95rem}

        .student-cell{display:flex;align-items:center;gap:12px}
        .sav{width:38px;height:38px;border-radius:10px;background:var(--cl);color:var(--caramel);display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',serif;font-size:.92rem;flex-shrink:0}
        .sname{font-weight:600;color:var(--text);font-size:.87rem}
        .sguardian{font-size:.72rem;color:var(--muted);margin-top:1px}

        /* ── STATUS TOGGLE ── */
        .status-toggle{display:inline-flex;background:var(--bg);border:1.5px solid var(--border);border-radius:50px;padding:3px;gap:2px}
        .status-toggle input{position:absolute;opacity:0;width:0;height:0}
        .status-toggle label{
            display:flex;align-items:center;gap:5px;font-size:.75rem;font-weight:600;padding:7px 14px;
            border-radius:50px;cursor:pointer;color:var(--muted);transition:all .25s var(--ease);user-select:none
        }
        .status-toggle label svg{width:12px;height:12px}
        .status-toggle input.p-radio:checked + label{background:rgba(46,125,50,.1);color:#2E7D32}
        .status-toggle input.a-radio:checked + label{background:rgba(198,40,40,.09);color:#C62828}
        .status-toggle label:hover{color:var(--text)}

        /* ── MOBILE ATTENDANCE LIST (shown under 720px) ── */
        .att-list{display:none}
        .att-row-card{padding:15px 20px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:12px}
        .att-row-card:last-child{border-bottom:none}
        .arc-top{display:flex;align-items:center;justify-content:space-between;gap:10px}

        /* ── ACTION FOOTER ── */
        .action-footer{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:18px 20px;border-top:1px solid var(--border);background:rgba(62,39,35,.015);flex-wrap:wrap}
        .action-note{font-size:.78rem;color:var(--muted);margin-right:auto}

        /* ── FAB (mobile only) ── */
        .fab{position:fixed;bottom:80px;right:20px;width:54px;height:54px;background:var(--coffee);border-radius:50%;display:none;align-items:center;justify-content:center;box-shadow:0 8px 25px rgba(62,39,35,.3);z-index:150;transition:background .3s;text-decoration:none;color:#fff}
        .fab:hover{background:var(--caramel)}
        .fab svg{width:24px;height:24px}

        /* ── BOTTOM NAV ── */
        .bnav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);padding:10px 0 14px;z-index:200}
        .bni{display:flex;justify-content:space-around}
        .bna{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--muted);font-size:.63rem;font-weight:600;padding:4px 10px}
        .bna.active{color:var(--coffee)}
        .bna svg{width:21px;height:21px}

        @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
        .ani{animation:fadeIn .5s var(--ease) both}
        .d1{animation-delay:.06s}.d2{animation-delay:.12s}.d3{animation-delay:.18s}

        @media(max-width:768px){
            .sidebar{transform:translateX(-100%);width:260px}
            .main{margin-left:0;padding:14px 14px 90px}
            .mhdr{display:flex}.bnav{display:block}.fab{display:flex}
            .topbar{flex-direction:column;align-items:flex-start}
            .filter-grid{justify-content:stretch}
            .f-field{flex:1 1 100%}
            .filter-grid .btn-primary{width:100%;justify-content:center}
        }
        @media(max-width:720px){
            .att-table{display:none}
            .att-list{display:block}
        }
        @media(max-width:480px){
            .action-footer{justify-content:center}
            .action-note{width:100%;text-align:center;order:3;margin-right:0}
            .action-footer .btn-outline,.action-footer .btn-primary{flex:1 1 auto;justify-content:center}
        }
    </style>

<script src="api.js"></script><script src="/shared_shell.js"></script><script>
const attendanceFilterForm = document.getElementById('attendanceFilterForm');
const attendanceForm = document.getElementById('attendanceForm');
const attendanceRows = document.getElementById('attendanceRows');
const attendanceCards = document.getElementById('attendanceCards');
const attendanceCount = document.getElementById('attendanceCount');
const titleEl = document.getElementById('attendanceBatchTitle');
const subtitleEl = document.getElementById('attendanceSubTitle');

function escapeHtml(value) {
  return String(value || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function getBatchLabel(batchCode) {
  const map = {
    'BATCHA': 'Batch A — Morning',
    'BATCHB': 'Batch B — Afternoon',
    'BATCHC': 'Batch C — Evening',
  };
  return map[batchCode] || batchCode || 'Selected Batch';
}

function renderRows(students, statusMap) {
  attendanceRows.innerHTML = students.map((student, index) => {
    const id = student.id;
    const rowNo = String(index + 1).padStart(2, '0');
    const initial = (student.name || 'S').trim().charAt(0).toUpperCase();
    const status = statusMap[id] || 'present';
    return `<tr>
      <td class="att-roll">${rowNo}</td>
      <td>
        <div class="student-cell">
          <div class="sav">${escapeHtml(initial)}</div>
          <div>
            <div class="sname">${escapeHtml(student.name)}</div>
            <div class="sguardian">Guardian: ${escapeHtml(student.phone || 'N/A')}</div>
          </div>
        </div>
      </td>
      <td class="status-col">
        <div class="status-toggle">
          <input ${status === 'present' ? 'checked' : ''} class="p-radio" id="p-${escapeHtml(id)}" name="status-${escapeHtml(id)}" type="radio" value="present"/>
          <label for="p-${escapeHtml(id)}">
            <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" viewbox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
            Present
          </label>
          <input ${status === 'absent' ? 'checked' : ''} class="a-radio" id="a-${escapeHtml(id)}" name="status-${escapeHtml(id)}" type="radio" value="absent"/>
          <label for="a-${escapeHtml(id)}">
            <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" viewbox="0 0 24 24"><line x1="18" x2="6" y1="6" y2="18"></line><line x1="6" x2="18" y1="6" y2="18"></line></svg>
            Not Present
          </label>
        </div>
      </td>
    </tr>`;
  }).join('');

  attendanceCards.innerHTML = students.map((student, index) => {
    const id = student.id;
    const rowNo = String(index + 1).padStart(2, '0');
    const initial = (student.name || 'S').trim().charAt(0).toUpperCase();
    const status = statusMap[id] || 'present';
    return `<div class="att-row-card">
      <div class="arc-top">
        <div class="student-cell">
          <div class="sav">${escapeHtml(initial)}</div>
          <div>
            <div class="sname">${escapeHtml(student.name)}</div>
            <div class="sguardian">Roll ${rowNo}</div>
          </div>
        </div>
      </div>
      <div class="status-toggle">
        <input ${status === 'present' ? 'checked' : ''} class="p-radio" id="mp-${escapeHtml(id)}" name="mstatus-${escapeHtml(id)}" type="radio" value="present"/>
        <label for="mp-${escapeHtml(id)}">
          <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" viewbox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
          Present
        </label>
        <input ${status === 'absent' ? 'checked' : ''} class="a-radio" id="ma-${escapeHtml(id)}" name="mstatus-${escapeHtml(id)}" type="radio" value="absent"/>
        <label for="ma-${escapeHtml(id)}">
          <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" viewbox="0 0 24 24"><line x1="18" x2="6" y1="6" y2="18"></line><line x1="6" x2="18" y1="6" y2="18"></line></svg>
          Not Present
        </label>
      </div>
    </div>`;
  }).join('');
}

async function loadAttendance() {
  const formData = new FormData(attendanceFilterForm);
  const batchCode = String(formData.get('batch_code') || '').trim();
  const date = String(formData.get('date') || '').trim();
  if (!batchCode || !date) {
    alert('Choose a batch and date first.');
    return;
  }

  try {
    const students = await GetStudentsInBatch(batchCode);
    const attendance = await GetAttendance(batchCode, date);
    const statusMap = {};
    if (attendance && attendance.records) {
      for (const record of attendance.records) {
        statusMap[record.student_id] = record.status;
      }
    }

    titleEl.textContent = getBatchLabel(batchCode);
    subtitleEl.textContent = `${document.getElementById('att-class').selectedOptions[0]?.text || 'Class'} · ${students.length} students enrolled`;
    renderRows(students, statusMap);
    attendanceCount.textContent = `${students.length} of ${students.length} students shown`;
  } catch (err) {
    console.error(err);
    alert(err.message || 'Could not load attendance');
  }
}

attendanceFilterForm.addEventListener('submit', function (event) {
  event.preventDefault();
  loadAttendance();
});

attendanceForm.addEventListener('submit', function (event) {
  event.preventDefault();
  const formData = new FormData(attendanceFilterForm);
  const batchCode = String(formData.get('batch_code') || '').trim();
  const date = String(formData.get('date') || '').trim();
  if (!batchCode || !date) {
    alert('Choose a batch and date before saving.');
    return;
  }

  const records = [];
  const radios = Array.from(attendanceForm.querySelectorAll('input[type="radio"]'));
  const statusMap = new Map();
  for (const radio of radios) {
    const studentId = radio.name.replace(/^status-/, '').replace(/^mstatus-/, '');
    if (radio.checked) {
      statusMap.set(studentId, radio.value);
    }
  }

  for (const [studentId, status] of statusMap.entries()) {
    records.push({ student_id: studentId, status });
  }

  SubmitAttendance({ batch_code: batchCode, date, records })
    .then((payload) => {
      alert(payload.message || 'Attendance saved');
    })
    .catch((err) => {
      console.error(err);
      alert(err.message || 'Attendance could not be saved');
    });
});

function toggleSB() {
  document.getElementById('sidebar').classList.toggle('mopen');
  document.getElementById('mov').classList.toggle('open');
}
function closeSB() {
  document.getElementById('sidebar').classList.remove('mopen');
  document.getElementById('mov').classList.remove('open');
}
function doLogout() {
  if (confirm('Log out?')) {
    logout('auth.html');
  }
}
