<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results | EduCoffee</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root{--bg:#FDFBF7;--coffee:#3E2723;--caramel:#C68642;--caramel-light:rgba(198,134,66,.10);--text:#2D241E;--muted:#7D6E64;--card:#FFFFFF;--border:rgba(62,39,35,.07);--shadow:0 2px 20px rgba(62,39,35,.06);--shadow-lg:0 12px 40px rgba(62,39,35,.10);--ease:cubic-bezier(.16,1,.3,1);--pass:#2E7D32;--fail:#C62828;--avg:#1565C0}
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

        /* SIDEBAR */
        .sidebar{position:fixed;top:0;left:0;height:100%;width:240px;background:var(--coffee);display:flex;flex-direction:column;z-index:200;transition:transform .4s var(--ease)}
        .sidebar-logo{padding:28px 24px 20px;font-family:'DM Serif Display',serif;font-size:1.5rem;color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}
        .sidebar-logo span{color:var(--caramel);font-style:italic}
        .sidebar-nav{flex:1;padding:16px 0;overflow-y:auto}
        .nav-link{display:flex;align-items:center;gap:12px;padding:12px 24px;color:rgba(255,255,255,.6);text-decoration:none;font-size:.88rem;font-weight:500;border-left:3px solid transparent;transition:all .25s}
        .nav-link:hover{color:#fff;background:rgba(255,255,255,.06)}
        .nav-link.active{color:#fff;border-left-color:var(--caramel);background:rgba(198,134,66,.12)}
        .nav-link svg{width:18px;height:18px;flex-shrink:0}
        .nav-section{padding:20px 24px 6px;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:rgba(255,255,255,.3)}
        .sidebar-footer{padding:20px 24px;border-top:1px solid rgba(255,255,255,.08)}
        .user-chip{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,255,255,.07);border-radius:12px}
        .user-avatar{width:34px;height:34px;border-radius:10px;background:var(--caramel);display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;color:#fff;flex-shrink:0}
        .user-info{flex:1;min-width:0}
        .user-name{font-size:.82rem;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .user-role{font-size:.68rem;color:rgba(255,255,255,.5)}

        /* MOBILE */
        .mobile-header{display:none;position:sticky;top:0;z-index:150;background:var(--card);border-bottom:1px solid var(--border);padding:14px 18px;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}
        .mobile-logo{font-family:'DM Serif Display',serif;font-size:1.3rem;color:var(--coffee);text-decoration:none}
        .mobile-logo span{color:var(--caramel);font-style:italic}
        .hamburger{background:none;border:none;cursor:pointer;padding:6px;border-radius:8px;color:var(--coffee)}
        .hamburger svg{width:22px;height:22px}
        .mobile-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:190;backdrop-filter:blur(3px);opacity:0;transition:opacity .3s}
        .mobile-overlay.open{display:block;opacity:1}
        .sidebar.mobile-open{transform:translateX(0)!important}

        /* MAIN */
        .main{margin-left:240px;padding:32px 28px 40px;min-height:100vh}

        /* PAGE HEADER */
        .page-header{margin-bottom:28px}
        .page-header h1{font-family:'DM Serif Display',serif;font-size:1.9rem;color:var(--coffee);margin-bottom:4px}
        .page-header p{font-size:.88rem;color:var(--muted)}

        /* BATCH TABS */
        .teacher-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:24px}
        .t-tab{padding:9px 18px;border-radius:50px;border:1.5px solid var(--border);background:var(--card);font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:600;color:var(--muted);cursor:pointer;transition:all .25s;display:flex;align-items:center;gap:7px}
        .t-tab.active{background:var(--coffee);color:#fff;border-color:var(--coffee)}
        .t-tab:hover:not(.active){border-color:var(--caramel);color:var(--caramel)}
        .t-tab-dot{width:7px;height:7px;border-radius:50%;background:var(--caramel)}

        /* SUMMARY CARDS */
        .summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
        .sum-card{background:var(--card);border-radius:18px;padding:18px 16px;border:1px solid var(--border);box-shadow:var(--shadow);text-align:center;transition:all .3s var(--ease)}
        .sum-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
        .sum-num{font-family:'DM Serif Display',serif;font-size:1.7rem;color:var(--coffee);line-height:1;margin-bottom:4px}
        .sum-lbl{font-size:.72rem;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.3px}
        .sum-card.highlight{background:var(--coffee)}
        .sum-card.highlight .sum-num{color:#fff}
        .sum-card.highlight .sum-lbl{color:rgba(255,255,255,.6)}

        /* CHART */
        .chart-card{background:var(--card);border-radius:22px;padding:24px;margin-bottom:24px;border:1px solid var(--border);box-shadow:var(--shadow)}
        .chart-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
        .chart-title{font-family:'DM Serif Display',serif;font-size:1.15rem;color:var(--coffee)}
        .trend-badge{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:50px;font-size:.75rem;font-weight:700}
        .trend-up{background:#E8F5E9;color:var(--pass)}
        .trend-down{background:#FFEBEE;color:var(--fail)}
        .trend-stable{background:var(--caramel-light);color:var(--caramel)}
        .chart-wrap{position:relative;height:220px}

        /* RESULT CARDS */
        .sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
        .sec-title{font-family:'DM Serif Display',serif;font-size:1.2rem;color:var(--coffee)}
        .sort-select{padding:7px 12px;border-radius:10px;border:1.5px solid var(--border);background:var(--card);font-family:'DM Sans',sans-serif;font-size:.78rem;color:var(--text);outline:none;cursor:pointer}
        .sort-select:focus{border-color:var(--caramel)}

        .results-list{display:flex;flex-direction:column;gap:10px}
        .result-card{background:var(--card);border-radius:18px;padding:18px 20px;border:1px solid var(--border);box-shadow:var(--shadow);display:flex;align-items:center;gap:16px;transition:all .3s var(--ease)}
        .result-card:hover{transform:translateX(5px);box-shadow:var(--shadow-lg);border-color:rgba(198,134,66,.3)}

        /* Progress circle */
        .score-circle{position:relative;width:56px;height:56px;flex-shrink:0}
        .score-circle svg{transform:rotate(-90deg)}
        .sc-bg{fill:none;stroke:rgba(62,39,35,.06);stroke-width:4}
        .sc-fg{fill:none;stroke-width:4;stroke-linecap:round}
        .sc-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',serif;font-size:.9rem;color:var(--coffee);font-weight:700}

        .rc-info{flex:1;min-width:0}
        .rc-exam{font-size:.93rem;font-weight:600;color:var(--text);margin-bottom:3px}
        .rc-meta{font-size:.75rem;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
        .rc-score{text-align:right;flex-shrink:0}
        .rc-main-score{font-family:'DM Serif Display',serif;font-size:1.25rem;color:var(--caramel);line-height:1}
        .rc-total{font-size:.72rem;color:var(--muted)}
        .rc-tag{display:inline-block;padding:3px 9px;border-radius:6px;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-top:4px}
        .tag-pass{background:#E8F5E9;color:var(--pass)}
        .tag-avg{background:#FFF8E1;color:#F57F17}
        .tag-fail{background:#FFEBEE;color:var(--fail)}
        .tag-exc{background:rgba(198,134,66,.15);color:var(--caramel)}
        .tag-absent{background:#F3E5F5;color:#6A1B9A}

        /* Empty */
        .empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
        .empty-state svg{width:48px;height:48px;opacity:.25;margin-bottom:12px}
        .empty-state h3{font-family:'DM Serif Display',serif;font-size:1.15rem;color:var(--coffee);margin-bottom:5px;opacity:.6}

        /* BOTTOM NAV */
        .bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);padding:10px 0 14px;z-index:200}
        .bnav-inner{display:flex;justify-content:space-around}
        .bnav-item{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--muted);font-size:.65rem;font-weight:600;padding:4px 12px;border-radius:10px;transition:color .2s}
        .bnav-item.active{color:var(--coffee)}
        .bnav-item svg{width:22px;height:22px}

        @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

        @media(max-width:900px){.summary-grid{grid-template-columns:repeat(2,1fr)}}
        @media(max-width:768px){
            .sidebar{transform:translateX(-100%);width:260px}
            .main{margin-left:0;padding:16px 16px 90px}
            .mobile-header{display:flex}
            .bottom-nav{display:block}
            .summary-grid{grid-template-columns:repeat(2,1fr);gap:10px}
            .chart-wrap{height:180px}
        }
        @media(max-width:480px){
            .result-card{gap:12px;padding:14px 16px}
            .score-circle{width:48px;height:48px}
            .rc-main-score{font-size:1.1rem}
        }
    </style>
</head>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">Edu<span>Coffee.</span></div>
    <nav class="sidebar-nav">
        <div class="nav-section">Main</div>
        <a href="student-dashboard.html" class="nav-link">

<div class="mobile-overlay" id="mobileOverlay" onclick="closeSidebar()"></div>

<header class="mobile-header">
    <a href="student-dashboard.html" class="mobile-logo">Edu<span>Coffee.</span></a>
    <button class="hamburger" onclick="toggleSidebar()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
</header>

<main class="main">
    <div class="page-header">
        <h1>Results & Analysis</h1>
        <p>Track your performance across all batches</p>
    </div>

    <!-- Batch Tabs -->

            <option value="score-low">Score (low → high)</option>

<script>
const API = 'https://educoffee.onrender.com/api';
const studentId = localStorage.getItem('current_userid');

if (!studentId) { window.location.href = 'auth.html'; }

const studentName = localStorage.getItem('current_user_name') || localStorage.getItem('userName') || 'Student';
document.getElementById('sidebarName').textContent = studentName;
document.getElementById('sidebarAvatar').textContent = studentName[0].toUpperCase();

// ── STATE ──
// allScores: enriched objects with title, total_marks, batch_code attached
let allScores = [];
let currentBatch = 'all';
let chartInstance = null;
let studentBatchCodes = [];

async function apiFetch(path) {
    try {
        const res = await fetch(API + path);
        if (!res.ok) return null;
        return await res.json();
    } catch { return null; }
}

async function init() {
    // Get student's batch codes
    const student = await apiFetch(`/user/${studentId}`);
    if (!student) {
        document.querySelector('.page-header p').textContent = 'Could not load data. Please refresh.';
        return;
    }
    studentBatchCodes = student.batch_codes || [];

    // Fetch raw scores for this student
    const rawScores = await apiFetch(`/results/student/${studentId}`) || [];
allScores = rawScores.map(s => ({
    ...s,
    percentage: (s.marks !== null && s.total_marks)
        ? Math.round((s.marks / s.total_marks) * 100)
        : null
}));

    if (!rawScores.length) {
        allScores = [];
        buildTabs();
        update();
        return;
    }

    // For each score, fetch the result metadata using the existing
    // GET /results/student/{student_id}/{result_id} endpoint
    // De-duplicate result_ids first to avoid redundant fetches
    const uniqueResultIds = [...new Set(rawScores.map(s => s.result_id))];

    const metaMap = {};
    await Promise.all(uniqueResultIds.map(async (rid) => {
        const detail = await apiFetch(`/results/student/${studentId}/${rid}`);
        if (detail) metaMap[rid] = detail;
    }));

    // We also need title + total_marks + batch_code which live on the Result,
    // not on StudentScore. Fetch all results to get that.
    // Use /results endpoint (returns all) and build a lookup.
    const allResults = await apiFetch('/results') || [];
    const resultLookup = {};
    allResults.forEach(r => { resultLookup[r.id] = r; });

    // Enrich each score
    allScores = rawScores.map(s => {
        const meta = resultLookup[s.result_id] || {};
        const marks = s.marks === null || s.marks === undefined ? null : Number(s.marks);
        const total_marks = meta.total_marks ?? null;
        const percentage = (marks !== null && total_marks) ? Math.round((marks / total_marks) * 100) : null;
        return {
            ...s,
            title: meta.title || 'Exam',
            description: meta.description || '',
            total_marks,
            batch_code: meta.batch_code || null,
            percentage,
        };
    });

    buildTabs();
    update();
}

// ── TABS ──
function buildTabs() {
    const container = document.getElementById('teacherTabs');
    container.innerHTML = '';

    const allTab = document.createElement('button');
    allTab.className = 't-tab active';
    allTab.textContent = 'All Batches';
    allTab.onclick = () => switchBatch('all', allTab);
    container.appendChild(allTab);

    studentBatchCodes.forEach(code => {
        const tab = document.createElement('button');
        tab.className = 't-tab';
        tab.innerHTML = `<div class="t-tab-dot"></div>${code}`;
        tab.onclick = () => switchBatch(code, tab);
        container.appendChild(tab);
    });
}

function switchBatch(code, btn) {
    currentBatch = code;
    document.querySelectorAll('.t-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    update();
}

// ── GET FILTERED SCORES ──
function getFilteredScores() {
    return allScores.filter(s => currentBatch === 'all' || s.batch_code === currentBatch);
}

function update() {
    const scores = getFilteredScores();
    updateSummary(scores);
    updateChart(scores);
    renderList();
}

// ── SUMMARY ──
function updateSummary(scores) {
    const scored = scores.filter(s => !s.absent && s.marks !== null && s.total_marks);
    const totalEarned   = scored.reduce((sum, s) => sum + Number(s.marks), 0);
    const totalPossible = scored.reduce((sum, s) => sum + Number(s.total_marks), 0);
    const overallPct    = totalPossible ? Math.round((totalEarned / totalPossible) * 100) : null;
    const best          = scored.reduce((max, s) => (s.percentage ?? -1) > max ? (s.percentage ?? -1) : max, -1);

    document.getElementById('sumTotal').textContent = scores.length;

    const badge = document.getElementById('trendBadge');

    if (!scored.length) {
        document.getElementById('sumAvg').textContent  = '—';
        document.getElementById('sumBest').textContent = '—';
        document.getElementById('sumTrend').textContent = '—';
        badge.className = 'trend-badge trend-stable';
        badge.textContent = '→ Stable';
        return;
    }

    document.getElementById('sumAvg').textContent  = overallPct !== null ? `${overallPct}%` : '—';
    document.getElementById('sumBest').textContent = best >= 0 ? `${best}%` : '—';

    const pcts = scored.map(s => s.percentage).filter(v => v !== null);
    if (pcts.length >= 2) {
        const diff = pcts[pcts.length - 1] - pcts[0];
        if (diff > 3) {
            document.getElementById('sumTrend').textContent = '↑ Up';
            badge.className = 'trend-badge trend-up'; badge.textContent = '↑ Improving';
        } else if (diff < -3) {
            document.getElementById('sumTrend').textContent = '↓ Down';
            badge.className = 'trend-badge trend-down'; badge.textContent = '↓ Declining';
        } else {
            document.getElementById('sumTrend').textContent = '→ Stable';
            badge.className = 'trend-badge trend-stable'; badge.textContent = '→ Stable';
        }
    } else {
        document.getElementById('sumTrend').textContent = '—';
        badge.className = 'trend-badge trend-stable'; badge.textContent = '→ Stable';
    }
}

// ── CHART ──
function updateChart(scores) {
    const ctx = document.getElementById('perfChart').getContext('2d');
    const scored = scores.filter(s => !s.absent && s.marks !== null && s.total_marks);

    if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
    if (!scored.length) return;

    const last8  = scored.slice(-8);
    const data   = last8.map(s => Math.round((s.marks / s.total_marks) * 100));
    const labels = last8.map(s => s.title.split(' ').slice(0, 2).join(' '));

    const grad = ctx.createLinearGradient(0, 0, 0, 220);
    grad.addColorStop(0, 'rgba(198,134,66,.35)');
    grad.addColorStop(1, 'rgba(198,134,66,0)');

    chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
            labels,
            datasets: [{
                data,
                borderColor: '#C68642',
                borderWidth: 2.5,
                pointBackgroundColor: '#3E2723',
                pointBorderColor: '#fff',
                pointBorderWidth: 2,
                pointRadius: 5,
                pointHoverRadius: 7,
                tension: .4,
                fill: true,
                backgroundColor: grad
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false }, tooltip: {
                callbacks: { label: ctx => ` ${ctx.parsed.y}%` }
            }},
            scales: {
                y: {
                    beginAtZero: false, min: 0, max: 100,
                    grid: { color: 'rgba(62,39,35,.04)' },
                    ticks: { stepSize: 20, font: { size: 11, family: "'DM Sans'" }, callback: v => v + '%' }
                },
                x: { grid: { display: false }, ticks: { font: { size: 10, family: "'DM Sans'" }, maxRotation: 30 } }
            }
        }
    });
}

// ── RESULTS LIST ──
function renderList() {
    let scores = getFilteredScores();
    const sortVal = document.getElementById('sortSelect').value;

    if (sortVal === 'score-high') {
        scores = scores.filter(s => !s.absent && s.percentage !== null)
            .sort((a, b) => b.percentage - a.percentage);
    } else if (sortVal === 'score-low') {
        scores = scores.filter(s => !s.absent && s.percentage !== null)
            .sort((a, b) => a.percentage - b.percentage);
    }

    const container = document.getElementById('resultsList');

    if (!scores.length) {
        container.innerHTML = `<div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <h3>No results yet</h3>
            <p>Results will appear here once published by your teacher.</p>
        </div>`;
        return;
    }

    container.innerHTML = scores.map(s => {
        if (s.absent) {
            return `
            <div class="result-card">
                <div class="score-circle">
                    <svg width="56" height="56" viewBox="0 0 56 56">
                        <circle class="sc-bg" cx="28" cy="28" r="24"/>
                    </svg>
                    <div class="sc-text">—</div>
                </div>
                <div class="rc-info">
                    <div class="rc-exam">${s.title}</div>
                    <div class="rc-meta">
                        <span>📋 Batch: ${s.batch_code || '—'}</span>
                        ${s.remarks ? `<span>💬 ${s.remarks}</span>` : ''}
                    </div>
                </div>
                <div class="rc-score">
                    <div class="rc-main-score">—</div>
                    <div class="rc-total">/ ${s.total_marks || '—'}</div>
                    <div class="rc-tag tag-absent">Absent</div>
                </div>
            </div>`;
        }

        const marks = s.marks ?? 0;
        const total = s.total_marks ?? null;
        const pct   = s.percentage !== null ? s.percentage : (total ? Math.round((marks / total) * 100) : null);
        const R = 24, C = 2 * Math.PI * R;
        const dash = pct !== null ? (pct / 100) * C : 0;
        const strokeColor = pct === null ? '#9E9E9E'
            : pct >= 85 ? '#2E7D32'
            : pct >= 70 ? '#C68642'
            : pct >= 50 ? '#1565C0'
            : '#C62828';
        const tagClass = pct === null ? 'tag-avg'
            : pct >= 85 ? 'tag-exc'
            : pct >= 70 ? 'tag-pass'
            : pct >= 50 ? 'tag-avg'
            : 'tag-fail';
        const tagText = pct === null ? 'Pending'
            : pct >= 85 ? 'Excellent'
            : pct >= 70 ? 'Good'
            : pct >= 50 ? 'Average'
            : 'Needs Work';

        return `
        <div class="result-card">
            <div class="score-circle">
                <svg width="56" height="56" viewBox="0 0 56 56">
                    <circle class="sc-bg" cx="28" cy="28" r="${R}"/>
                    <circle class="sc-fg" cx="28" cy="28" r="${R}"
                        stroke="${strokeColor}"
                        stroke-dasharray="${dash.toFixed(1)} ${C.toFixed(1)}"
                        stroke-dashoffset="0"/>
                </svg>
                <div class="sc-text">${pct !== null ? pct + '%' : '—'}</div>
            </div>
            <div class="rc-info">
                <div class="rc-exam">${s.title}</div>
                <div class="rc-meta">
                    <span>📋 Batch: ${s.batch_code || '—'}</span>
                    ${s.description ? `<span>📝 ${s.description}</span>` : ''}
                </div>
            </div>
            <div class="rc-score">
                <div class="rc-main-score">${marks}</div>
                <div class="rc-total">/ ${total !== null ? total : '—'}</div>
                <div class="rc-tag ${tagClass}">${tagText}</div>
            </div>
        </div>`;
    }).join('');
}

function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('mobile-open');
    document.getElementById('mobileOverlay').classList.toggle('open');
}
function closeSidebar() {
    document.getElementById('sidebar').classList.remove('mobile-open');
    document.getElementById('mobileOverlay').classList.remove('open');
}

init();
</script>
