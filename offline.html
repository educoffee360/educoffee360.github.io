<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You are Offline | EduCoffee</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Progressive Web App Meta tags & Links -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0, 		maximum-scale=1.0, user-scalable=no">
	<link rel="manifest" href="/manifest.json">
	<meta name="theme-color" content="#3E2723">

	<!-- iOS Web App Capability & Standard Styles -->
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="default">
	<meta name="apple-mobile-web-app-title" content="EduCoffee">
	<link rel="apple-touch-icon" href="/assets/icons/icon-192.png">

	<!-- Custom PWA Installation Interceptor & Service Worker -->
	<script src="/pwa-installer.js" defer></script>


	<!-- Favicon -->
	<link rel="icon" href="/assets/icons/favicon.ico" type="image/x-icon">
	<link rel="icon" type="image/png" href="/assets/icons/favicon-32x32.png">
	<!-- Apple Touch Icon -->
	<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
    
    <style>
        :root {
            --cream: #FDFBF7;
            --coffee: #3E2723;
            --caramel: #C68642;
            --text: #2D241E;
            --muted: #7D6E64;
            --card: #FFFFFF;
            --border: rgba(62,39,35,.08);
            --shadow-lg: 0 20px 60px rgba(62,39,35,.14);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Sora', sans-serif;
            background: var(--cream);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .container {
            background: var(--card);
            padding: 48px 32px;
            border-radius: 28px;
            box-shadow: var(--shadow-lg);
            border: 1.5px solid var(--border);
            max-width: 480px;
            width: 100%;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 24px;
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        h1 {
            font-family: 'DM Serif Display', serif;
            font-size: 2rem;
            color: var(--coffee);
            margin-bottom: 12px;
        }
        p {
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .btn-retry {
            width: 100%;
            padding: 15px 32px;
            background: var(--coffee);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(.16,1,.3,1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-retry:hover {
            background: var(--caramel);
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(198,134,66,.35);
        }
        .btn-retry svg {
            width: 18px;
            height: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">☕</div>
        <h1>Connection Lost</h1>
        <p>It seems your coffee cold-brewed. Check your internet connection and try reloading the page to get back to EduCoffee.</p>
        <button class="btn-retry" onclick="window.location.reload()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
            </svg>
            Try Again
        </button>
    </div>
</body>
</html>
