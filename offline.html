<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>You are Offline | EduCoffee</title>

<!-- Progressive Web App Meta tags & Links -->



<!-- iOS Web App Capability & Standard Styles -->




<!-- Custom PWA Installation Interceptor & Service Worker -->
<script defer id="educoffee-pwa-installer" src="/pwa_installer.js"></script>
<!-- Favicon -->


<!-- Apple Touch Icon -->

<style>
        :root {
            --cream: #FDFBF7;
            --coffee: #3E2723;
            --caramel: #C68642;
            --text: #2D241E;
            --muted: #7D6E64;
            --card: #FFFFFF;
            --border: rgba(62,39,35,.08);
            --shadow-lg: 0 20px 60px rgba(62,39,35,.14);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Sora', sans-serif;
            background: var(--cream);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .container {
            background: var(--card);
            padding: 48px 32px;
            border-radius: 28px;
            box-shadow: var(--shadow-lg);
            border: 1.5px solid var(--border);
            max-width: 480px;
            width: 100%;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 24px;
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        h1 {
            font-family: 'DM Serif Display', serif;
            font-size: 2rem;
            color: var(--coffee);
            margin-bottom: 12px;
        }
        p {
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .btn-retry {
            width: 100%;
            padding: 15px 32px;
            background: var(--coffee);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(.16,1,.3,1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-retry:hover {
            background: var(--caramel);
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(198,134,66,.35);
        }
        .btn-retry svg {
            width: 18px;
            height: 18px;
        }
    </style>
<script defer="True" src="/shared_head.js"></script></head>
<body>
<div class="container">
<div class="icon">☕</div>
<h1>Connection Lost</h1>
<p>It seems your coffee cold-brewed. Check your internet connection and try reloading the page to get back to EduCoffee.</p>
<button class="btn-retry" onclick="window.location.reload()">
<svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
</svg>
            Try Again
        </button>
</div>
</body>
</html>
