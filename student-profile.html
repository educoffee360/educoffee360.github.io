<style>
        :root{--bg:#FDFBF7;--coffee:#3E2723;--caramel:#C68642;--caramel-light:rgba(198,134,66,.10);--text:#2D241E;--muted:#7D6E64;--card:#FFFFFF;--border:rgba(62,39,35,.07);--shadow:0 2px 20px rgba(62,39,35,.06);--shadow-lg:0 12px 40px rgba(62,39,35,.10);--ease:cubic-bezier(.16,1,.3,1)}
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

        /* SIDEBAR */
        .sidebar{position:fixed;top:0;left:0;height:100%;width:240px;background:var(--coffee);display:flex;flex-direction:column;z-index:200;transition:transform .4s var(--ease)}
        .sidebar-logo{padding:28px 24px 20px;font-family:'DM Serif Display',serif;font-size:1.5rem;color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}
        .sidebar-logo span{color:var(--caramel);font-style:italic}
        .sidebar-nav{flex:1;padding:16px 0;overflow-y:auto}
        .nav-link{display:flex;align-items:center;gap:12px;padding:12px 24px;color:rgba(255,255,255,.6);text-decoration:none;font-size:.88rem;font-weight:500;border-left:3px solid transparent;transition:all .25s}
        .nav-link:hover{color:#fff;background:rgba(255,255,255,.06)}
        .nav-link.active{color:#fff;border-left-color:var(--caramel);background:rgba(198,134,66,.12)}
        .nav-link svg{width:18px;height:18px;flex-shrink:0}
        .nav-section{padding:20px 24px 6px;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:rgba(255,255,255,.3)}
        .sidebar-footer{padding:20px 24px;border-top:1px solid rgba(255,255,255,.08)}
        .user-chip{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,255,255,.07);border-radius:12px}
        .user-avatar-sm{width:34px;height:34px;border-radius:10px;background:var(--caramel);display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;color:#fff;flex-shrink:0}
        .user-info{flex:1;min-width:0}
        .user-name{font-size:.82rem;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .user-role{font-size:.68rem;color:rgba(255,255,255,.5)}

        .mobile-header{display:none;position:sticky;top:0;z-index:150;background:var(--card);border-bottom:1px solid var(--border);padding:14px 18px;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}
        .mobile-logo{font-family:'DM Serif Display',serif;font-size:1.3rem;color:var(--coffee);text-decoration:none}
        .mobile-logo span{color:var(--caramel);font-style:italic}
        .hamburger{background:none;border:none;cursor:pointer;padding:6px;border-radius:8px;color:var(--coffee)}
        .hamburger svg{width:22px;height:22px}
        .mobile-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:190;backdrop-filter:blur(3px);opacity:0;transition:opacity .3s}
        .mobile-overlay.open{display:block;opacity:1}
        .sidebar.mobile-open{transform:translateX(0)!important}

        .main{margin-left:240px;padding:32px 28px 40px;min-height:100vh}

        /* PROFILE HERO */
        .profile-hero{background:linear-gradient(135deg,var(--coffee) 0%,#5D4037 100%);border-radius:24px;padding:32px;display:flex;align-items:center;gap:24px;margin-bottom:28px;position:relative;overflow:hidden}
        .profile-hero::before{content:'';position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.04)}
        .profile-hero::after{content:'';position:absolute;right:40px;bottom:-50px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.03)}
        .avatar-large{width:80px;height:80px;border-radius:20px;background:var(--caramel);display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',serif;font-size:2rem;color:#fff;flex-shrink:0;position:relative;z-index:1}
        .profile-info{flex:1;position:relative;z-index:1}
        .profile-name{font-family:'DM Serif Display',serif;font-size:1.6rem;color:#fff;margin-bottom:4px}
        .profile-email{font-size:.85rem;color:rgba(255,255,255,.65);margin-bottom:10px}
        .profile-role-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;background:rgba(198,134,66,.25);border-radius:50px;font-size:.72rem;font-weight:700;color:var(--caramel);text-transform:uppercase;letter-spacing:.5px}
        .edit-btn{padding:10px 18px;border-radius:50px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .25s;white-space:nowrap;position:relative;z-index:1}
        .edit-btn:hover{background:rgba(255,255,255,.2)}

        /* SECTION CARD */
        .sec-card{background:var(--card);border-radius:20px;border:1px solid var(--border);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
        .sec-card-header{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
        .sec-card-title{font-family:'DM Serif Display',serif;font-size:1.05rem;color:var(--coffee);display:flex;align-items:center;gap:8px}
        .sec-card-title svg{width:18px;height:18px;color:var(--caramel)}
        .sec-edit-btn{background:none;border:none;font-family:'DM Sans',sans-serif;font-size:.78rem;font-weight:600;color:var(--caramel);cursor:pointer;padding:5px 10px;border-radius:8px;transition:background .2s}
        .sec-edit-btn:hover{background:var(--caramel-light)}
        .sec-card-body{padding:20px 22px}

        /* INFO ROWS */
        .info-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
        .info-row:last-child{border-bottom:none}
        .ir-label{font-size:.8rem;color:var(--muted);font-weight:500}
        .ir-value{font-size:.88rem;color:var(--text);font-weight:600}

        /* FORM */
        .form-group{margin-bottom:16px}
        .form-label{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:7px;display:block}
        .form-input{width:100%;padding:12px 15px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg);font-family:'DM Sans',sans-serif;font-size:.92rem;color:var(--text);outline:none;transition:all .25s}
        .form-input:focus{border-color:var(--caramel);box-shadow:0 0 0 4px rgba(198,134,66,.08);background:#fff}
        .form-input:disabled{opacity:.5;cursor:not-allowed}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
        .save-btn{width:100%;padding:13px;border-radius:12px;background:var(--coffee);color:#fff;border:none;font-family:'DM Sans',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;transition:all .25s;margin-top:6px}
        .save-btn:hover{background:var(--caramel)}
        .save-btn:disabled{opacity:.6;cursor:not-allowed}

        /* ENROLLED BATCHES */
        .enrolled-batch{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--border)}
        .enrolled-batch:last-child{border-bottom:none}
        .eb-avatar{width:44px;height:44px;border-radius:12px;background:var(--coffee);display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',serif;font-size:1.1rem;color:#fff;flex-shrink:0}
        .eb-info{flex:1;min-width:0}
        .eb-name{font-size:.9rem;font-weight:600;color:var(--text)}
        .eb-meta{font-size:.75rem;color:var(--muted);margin-top:2px}

        /* DANGER */
        .danger-btn{width:100%;padding:13px;border-radius:12px;background:#FFF5F5;color:#C62828;border:1px solid #FFCDD2;font-family:'DM Sans',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;transition:all .25s}
        .danger-btn:hover{background:#FFEBEE}

        /* TOAST */
        .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--coffee);color:#fff;padding:10px 20px;border-radius:50px;font-size:.85rem;font-weight:600;z-index:9999;animation:fadeIn .3s ease;white-space:nowrap}

        /* BOTTOM NAV */
        .bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);padding:10px 0 14px;z-index:200}
        .bnav-inner{display:flex;justify-content:space-around}
        .bnav-item{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--muted);font-size:.65rem;font-weight:600;padding:4px 12px;border-radius:10px;transition:color .2s}
        .bnav-item.active{color:var(--coffee)}
        .bnav-item svg{width:22px;height:22px}

        .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle}
        @keyframes spin{to{transform:rotate(360deg)}}
        @keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(6px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

        @media(max-width:768px){
            .sidebar{transform:translateX(-100%);width:260px}
            .main{margin-left:0;padding:16px 16px 90px}
            .mobile-header{display:flex}
            .bottom-nav{display:block}
            .profile-hero{flex-direction:column;text-align:center}
            .form-row{grid-template-columns:1fr}
        }
    </style>
<script defer="True" src="/shared_head.js"></script></head>
<body data-ec-layout="student" data-ec-page="student-profile">
<!-- SIDEBAR -->
<div data-ec-layout="student" data-ec-page="student-profile" id="ec-shell"></div><main class="main">
<!-- Profile Hero -->
<div class="profile-hero">
<div class="avatar-large" id="heroAvatar">S</div>
<div class="profile-info">
<div class="profile-name" id="heroName">—</div>
<div class="profile-email" id="heroEmail">—</div>
<div class="profile-role-badge">Student</div>
</div>
<button class="edit-btn" onclick="toggleEdit()">✏️ Edit Profile</button>
</div>
<!-- Personal Info Card -->
<div class="sec-card">
<div class="sec-card-header">
<div class="sec-card-title">
<svg fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"></path></svg>
                Personal Information
            </div>
</div>
<!-- VIEW MODE -->
<div class="sec-card-body" id="viewMode">
<div class="info-row"><span class="ir-label">Name</span><span class="ir-value" id="viewName">—</span></div>
<div class="info-row"><span class="ir-label">Email</span><span class="ir-value" id="viewEmail">—</span></div>
<div class="info-row"><span class="ir-label">Phone</span><span class="ir-value" id="viewPhone">—</span></div>
</div>
<!-- EDIT MODE -->
<div class="sec-card-body" id="editMode" style="display:none">
<div class="form-group">
<label class="form-label">Full Name</label>
<input class="form-input" id="editName" placeholder="Your name" type="text"/>
</div>
<div class="form-group">
<label class="form-label">Phone Number</label>
<input class="form-input" id="editPhone" placeholder="+880 1XXXXXXXXX" type="tel"/>
</div>
<div class="form-group">
<label class="form-label">Email</label>
<input class="form-input" disabled="" id="editEmail" type="email"/>
</div>
<p id="editErr" style="font-size:.75rem;color:#C62828;display:none;margin-bottom:8px"></p>

<div class="sec-card">
<div class="sec-card-header">
<div class="sec-card-title">
<svg fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                My Enrolled Batches
            </div>
<button class="sec-edit-btn" onclick="location.href='student-dashboard.html'">+ Join New</button>
</div>
<div class="sec-card-body" id="enrolledList">
<p style="color:var(--muted);font-size:.85rem">Loading…</p>
</div>
</div>
<!-- Change Password -->
<div class="sec-card">
<div class="sec-card-header">
<div class="sec-card-title">
<svg fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><rect height="11" rx="2" width="18" x="3" y="11"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                Change Password
            </div>
</div>
<div class="sec-card-body">
<div class="form-group"><label class="form-label" for="studentCurrentPassword">Current Password</label><input autocomplete="current-password" class="form-input" id="studentCurrentPassword" placeholder="Enter current password" type="password"/></div>
<div class="form-row">
<div class="form-group"><label class="form-label" for="studentNewPassword">New Password</label><input autocomplete="new-password" class="form-input" id="studentNewPassword" minlength="6" placeholder="At least 6 characters" type="password"/></div>
<div class="form-group"><label class="form-label" for="studentConfirmPassword">Confirm Password</label><input autocomplete="new-password" class="form-input" id="studentConfirmPassword" minlength="6" placeholder="Retype password" type="password"/></div>
</div>
<p id="studentPasswordError" style="display:none;color:#C62828;font-size:.78rem;margin-bottom:10px"></p>
<button class="save-btn" id="studentPasswordBtn" onclick="changeStudentPassword()">Change Password</button>
</div>
</div>
<!-- Danger Zone -->
<div class="sec-card">
<div class="sec-card-header">
<div class="sec-card-title" style="color:#C62828">
<svg fill="none" stroke="#C62828" stroke-width="2" viewbox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" x2="12" y1="9" y2="13"></line><line x1="12" x2="12.01" y1="17" y2="17"></line></svg>
                Danger Zone
            </div>
</div>
<div class="sec-card-body">
<button class="danger-btn" onclick="doLogout()">Log Out</button>

<script src="api.js"></script><script src="shared_shell.js"></script><script>
const currentSession = getCurrentSession();
if (!currentSession || currentSession.role !== 'student') { window.location.href = 'auth.html'; }
const studentId = currentSession.id;

let editOpen = false;
let userData = null;

async function init() {
    if (!studentId) return;
    const data = await GetUserByID(studentId);
    if (!data) return;
    userData = data;

    // Sidebar
    const __sidebarName = document.getElementById('sidebarName'); if (__sidebarName) __sidebarName.textContent = data.name;
    const __sidebarAvatar = document.getElementById('sidebarAvatar'); if (__sidebarAvatar) __sidebarAvatar.textContent = data.name[0].toUpperCase();

    // Hero
    document.getElementById('heroAvatar').textContent = data.name[0].toUpperCase();
    document.getElementById('heroName').textContent = data.name;
    document.getElementById('heroEmail').textContent = data.email;

    // View mode
    document.getElementById('viewName').textContent = data.name;
    document.getElementById('viewEmail').textContent = data.email;
    document.getElementById('viewPhone').textContent = data.phone || '—';

    // Edit mode prefill
    document.getElementById('editName').value = data.name;
    document.getElementById('editPhone').value = data.phone || '';
    document.getElementById('editEmail').value = data.email;

    renderBatches(data.batch_codes || []);
}


async function renderBatches(batchCodes) {
    const container = document.getElementById('enrolledList');
    if (!batchCodes.length) {
        container.innerHTML = '<p style="color:var(--muted);font-size:.85rem">No batches joined yet. Go to Dashboard to join one.</p>';
        return;
    }

    const allBatches = await GetAllBatches() || [];
    const enrolled = allBatches.filter(b => batchCodes.includes(b.code));

    container.innerHTML = enrolled.map(b => `
        <div class="enrolled-batch">
            <div class="eb-avatar">${b.code[0]}</div>
            <div class="eb-info">
                <div class="eb-name">${b.name}</div>
                <div class="eb-meta">${b.year} · ${b.schedule} · <code style="background:rgba(198,134,66,.1);padding:1px 6px;border-radius:4px;font-size:.7rem">${b.code}</code></div>
            </div>
        </div>
    `).join('') || '<p style="color:var(--muted);font-size:.85rem">No batch details found.</p>';
}

function toggleEdit() {
    editOpen = !editOpen;
    document.getElementById('viewMode').style.display = editOpen ? 'none' : 'block';
    document.getElementById('editMode').style.display = editOpen ? 'block' : 'none';
    document.querySelector('.edit-btn').textContent = editOpen ? '✕ Cancel' : '✏️ Edit Profile';
    document.getElementById('editErr').style.display = 'none';
}

async function saveProfile() {
    const name = document.getElementById('editName').value.trim();
    const phone = document.getElementById('editPhone').value.trim();
    const errEl = document.getElementById('editErr');
    const btn = document.getElementById('saveBtn');
    errEl.style.display = 'none';

    if (!name) { errEl.textContent = 'Name is required.'; errEl.style.display = 'block'; return; }
    if (!phone) { errEl.textContent = 'Phone number is required.'; errEl.style.display = 'block'; return; }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Saving…';

    try {
        const updated = await UpdateUserProfile(studentId, { name, phone });
        userData = updated;
        document.getElementById('viewName').textContent = updated.name;
        document.getElementById('viewPhone').textContent = updated.phone || '—';
        document.getElementById('heroName').textContent = updated.name;
        document.getElementById('heroAvatar').textContent = updated.name[0].toUpperCase();
        const __sidebarName = document.getElementById('sidebarName'); if (__sidebarName) __sidebarName.textContent = updated.name;
        const __sidebarAvatar = document.getElementById('sidebarAvatar'); if (__sidebarAvatar) __sidebarAvatar.textContent = updated.name[0].toUpperCase();
        localStorage.setItem('userName', updated.name);
        localStorage.setItem('current_user_name', updated.name);

        toggleEdit();
        showToast('Profile updated ✓');
    } catch (error) {
        errEl.textContent = error?.message || 'Could not update profile.';
        errEl.style.display = 'block';
    } finally {
        btn.disabled = false;
        btn.innerHTML = 'Save Changes';
    }
}

function doLogout() {
    logout('auth.html');
}

async function changeStudentPassword() {
    const currentPassword = document.getElementById('studentCurrentPassword').value;
    const newPassword = document.getElementById('studentNewPassword').value;
    const confirmPassword = document.getElementById('studentConfirmPassword').value;
    const error = document.getElementById('studentPasswordError');
    const button = document.getElementById('studentPasswordBtn');
    error.style.display = 'none';
    if (!currentPassword || !newPassword || !confirmPassword) {
        error.textContent = 'Please fill in all password fields.'; error.style.display = 'block'; return;
    }
    if (newPassword.length < 6) {
        error.textContent = 'Password must be at least 6 characters.'; error.style.display = 'block'; return;
    }
    if (newPassword !== confirmPassword) {
        error.textContent = 'Passwords do not match.'; error.style.display = 'block'; return;
    }
    const originalText = button.textContent;
    button.disabled = true;
    button.textContent = 'Changing password...';
    try {
        await ChangePassword(currentPassword, newPassword);
        ['studentCurrentPassword','studentNewPassword','studentConfirmPassword'].forEach(id => document.getElementById(id).value = '');
        showToast('Password changed successfully');
    } catch (requestError) {
        error.textContent = requestError?.message || 'Could not change password.';
        error.style.display = 'block';
    } finally {
        button.disabled = false;
        button.textContent = originalText;
    }
}

function showToast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2500);
}

function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('mobile-open');
    document.getElementById('mobileOverlay').classList.toggle('open');
}
function closeSidebar() {
    document.getElementById('sidebar').classList.remove('mobile-open');
    document.getElementById('mobileOverlay').classList.remove('open');
}

showPageLoading('Loading your profile…');
init().finally(hidePageLoading);
</script>
</body>
</html>
